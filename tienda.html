<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Productos · Calzados Ricardo</title>
  <meta name="description" content="Catálogo de Calzados Ricardo: calzado confort, para pies anchos y juanetes, apto para plantillas ortopédicas, zuecos de trabajo, vestir y casa. Filtra por ancho, cierre, talla y marca.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header data-cabecera></header>

  <div class="encabezado-pagina">
    <div class="contenedor">
      <h1 id="listado-titulo">Todos los productos</h1>
      <p>Calzado confort, para pies anchos, apto para plantillas y zuecos de trabajo. Filtra por ancho, cierre y talla. Precios con impuestos incluidos.</p>
    </div>
  </div>

  <main class="seccion">
    <div class="contenedor" id="listado">
      <div class="listado">
        <aside class="filtros" id="filtros">
          <h3>Filtros</h3>
          <form id="filtros-form">
            <div class="filtros__grupo">
              <div class="campo"><label for="f-texto">Buscar</label>
                <input id="f-texto" name="texto" type="search" placeholder="Modelo, marca, ref…"></div>
            </div>
            <div class="filtros__grupo">
              <h4>Género</h4>
              <div class="filtros__opcs" data-grupo="genero"></div>
            </div>
            <div class="filtros__grupo">
              <h4>Tipo de calzado</h4>
              <div class="filtros__opcs" data-grupo="categoria"></div>
            </div>
            <div class="filtros__grupo">
              <h4>Ancho / horma</h4>
              <div class="filtros__opcs" data-grupo="ancho"></div>
            </div>
            <div class="filtros__grupo">
              <h4>Cierre</h4>
              <div class="filtros__opcs" data-grupo="cierre"></div>
            </div>
            <div class="filtros__grupo">
              <h4>Marca</h4>
              <div class="filtros__opcs" data-grupo="marca"></div>
            </div>
            <div class="filtros__grupo">
              <h4>Talla</h4>
              <div class="chips" data-grupo="tallas"></div>
            </div>
            <div class="filtros__grupo">
              <div class="campo"><label for="f-pmax">Precio máximo (€)</label>
                <input id="f-pmax" name="precioMax" type="number" min="0" step="5" placeholder="Sin límite"></div>
              <label style="display:flex;gap:.5rem;font-size:.9rem;margin-top:.7rem"><input type="checkbox" name="aptoPlantillas"> Apto para plantillas ortopédicas</label>
              <label style="display:flex;gap:.5rem;font-size:.9rem;margin-top:.4rem"><input type="checkbox" name="soloNovedades"> Solo novedades</label>
              <label style="display:flex;gap:.5rem;font-size:.9rem;margin-top:.4rem"><input type="checkbox" name="soloDisponibles"> Solo con stock</label>
            </div>
            <button class="btn btn--linea btn--bloque" type="button" id="btn-limpiar" style="margin-top:.6rem">Limpiar filtros</button>
          </form>
        </aside>

        <div>
          <div class="listado__barra">
            <button class="btn btn--linea filtros-toggle" id="filtros-toggle" type="button">Filtros</button>
            <span class="listado__conteo" id="resultados-conteo">Cargando…</span>
            <label class="campo" style="flex-direction:row;align-items:center;gap:.5rem">
              <span style="font-size:.85rem">Ordenar:</span>
              <select id="orden">
                <option value="">Recomendado</option>
                <option value="novedades">Novedades</option>
                <option value="precio-asc">Precio: de menor a mayor</option>
                <option value="precio-desc">Precio: de mayor a menor</option>
              </select>
            </label>
          </div>
          <div class="rejilla" id="resultados-grid"><div class="cargando">Cargando productos…</div></div>
        </div>
      </div>
    </div>
  </main>

  <footer data-pie></footer>

  <script src="data/productos.js"></script>
  <script src="js/favoritos.js"></script>
  <script src="js/carrito.js"></script>
  <script src="js/data.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/tienda.js"></script>
</body>
</html>
